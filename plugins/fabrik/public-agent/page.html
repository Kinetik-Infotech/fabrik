<!doctype html>
<!-- fabrik's chat pages. fabrik chat-page fills in the title, icon, style, logo, name and links to the other agents from the Brand record, and the main
     part: an agent's chat box, at <slug>/index.html, or the list of agents by topic, at index.html, whose header holds the
     link that closes the list. Where there is a main agent, the logo links to its page, except on that page itself. Cloudflare Pages hosts them
     beside chat.js and widget.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}}</title>
<link rel="icon" href="{{ICON}}">
<style>
{{STYLE}}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; color: var(--ink); background: var(--paper);
  font: 16px/1.5 var(--body-font); -webkit-font-smoothing: antialiased; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 20px; border-bottom: 2px solid var(--accent); }
header a.home { display: inline-flex; border-radius: 4px; }
header a.home:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header img { height: 36px; width: auto; max-width: 160px; object-fit: contain; }
header h1 { margin: 0; font: 600 20px/1.2 var(--heading-font); }
header h1.in-logo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
header nav { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; }
header nav a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
header nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header nav .topic { color: var(--muted); font-weight: 600; }
header nav .topic::after { content: ":"; }
header a.close { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 16px 8px 12px; border: 1px solid var(--rule);
  border-radius: 999px; background: var(--card); color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
header a.close:hover { border-color: var(--accent); }
header a.close:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header a.close[hidden] { display: none; }
main { flex: 1; min-height: 0; display: flex; padding: 16px 20px 20px; }
main .fabrik-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; margin: 0 auto; }
main .fabrik-chat ol { flex: 1; min-height: 0; overflow-y: auto; align-content: start; gap: 10px; padding: 2px; }
main .fabrik-chat li { max-width: 85%; padding: 10px 14px; border-radius: 14px; }
main .fabrik-chat li.q { background: var(--accent); color: var(--on-accent); }
main .fabrik-chat li.a { background: var(--card); border: 1px solid var(--rule); color: var(--ink); padding-left: 40px; }
main .fabrik-chat li.a::before { left: 10px; top: 10px; }
main .fabrik-chat li.problem { color: var(--refused); }
main .fabrik-chat form { flex-wrap: nowrap; gap: 8px; }
main .fabrik-chat input[type=text] { padding: 12px 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--card); color: var(--ink); }
main .fabrik-chat input[type=text]:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; }
main .fabrik-chat button { padding: 12px 22px; border: 0; border-radius: 999px; cursor: pointer; background: var(--accent); color: var(--on-accent); font-weight: 600; }
main .fabrik-chat button:disabled { opacity: 0.55; cursor: default; }
main .fabrik-chat button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
main .fabrik-chat p.kept { color: var(--muted); opacity: 1; text-align: center; }
main .agents { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 12px; align-content: start; width: 100%; max-width: 760px; }
main .agents a { display: block; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); color: var(--ink); text-decoration: none; }
main .agents a:hover, main .agents a:focus-visible { border-color: var(--accent); outline: none; }
main .agents strong { display: block; font: 600 17px/1.3 var(--heading-font); }
main .agents span { color: var(--muted); }
main .topics { width: 100%; max-width: 760px; margin: 0 auto; }
main .topics .main + section, main .topics section + section { margin-top: 28px; }
main .topics h2 { margin: 0 0 10px; font: 600 19px/1.3 var(--heading-font); }
@media (max-width: 640px) { header nav { margin-left: 0; flex-basis: 100%; } }
@media (max-width: 480px) { header { padding: 10px 16px; } main { padding: 12px 16px 16px; } }
</style>
</head>
<body>
<header>{{LOGO}}{{HEADING}}{{NAV}}</header>
<main>{{MAIN}}</main>
{{SCRIPT}}
</body>
</html>
