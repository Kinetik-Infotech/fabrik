<style>
.bd-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bd-tools label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.bd-tools select { padding: 3px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; max-width: 260px; }
.bd-scroll { overflow-x: auto; }
.bd-grid { display: grid; gap: 6px; min-width: min-content; }
.bd-colhead { position: sticky; top: 0; font-size: 13px; font-weight: 600; padding: 4px 2px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: baseline; }
.bd-colhead .fk-sub { font-weight: 400; }
.bd-colhead button { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-decoration: underline dotted; }
.bd-cell { display: grid; gap: 6px; align-content: start; min-width: 0; }
.bd-rowhead { border-left: 3px solid var(--line); }
.bd-row { display: grid; gap: 6px; }
.bd-row h3 { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.bd-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
@media (max-width: 560px) { .bd-cards { grid-template-columns: 1fr; } }
</style>
<div class="fk">
  <div class="fk-head">
    <h2 id="bd-title">Board</h2>
    <div class="bd-tools" id="bd-tools"></div>
    <button class="fk-btn" id="bd-refresh">Refresh</button>
  </div>
  <p class="fk-sub" id="bd-meta"></p>
  <div class="fk-panel" id="fk-panel" hidden></div>
  <div id="fk-body"><p class="fk-sub">Reading fabrik…</p></div>
</div>
<script>
// The board card. With a plan: a row for each part of the plan, and its activities as cards in columns by state, from
// the plan's progress, as the board skill draws it. With a model: its nodes as cards, in rows by type or by an attribute.
// With no record: the person's newest records as cards, in columns by kind. card_view reads what it draws, Refresh reads
// it again, and each record's card opens its fields through card_record.
var given = {}, view = null, part = null, cancelledOpen = false, groupBy = "type";

function load() {
  $("bd-refresh").disabled = true;
  return read("card_view", given.record_id ? { record: given.record_id } : {})
    .then(function (v) { view = v; draw(); }, function (e) { failed($("fk-body"), e); })
    .then(function () { $("bd-refresh").disabled = false; });
}
function draw() {
  $("bd-tools").innerHTML = "";
  if (view.view === "recent") drawRecent(); else if (view.view === "plan") drawPlan(); else drawModel();
}
function column(head, count, cards, id) {
  return '<div class="bd-cell"' + (id ? ' id="' + id + '"' : "") + '><div class="bd-colhead">' + head + ' <span class="fk-sub">' + count + "</span></div>" + cards + "</div>";
}

// ---- The newest records ----

function drawRecent() {
  $("bd-title").textContent = "Newest records";
  $("bd-meta").textContent = "The " + counted(view.items.length, "record") + " you can read that were saved most recently, newest first, read at save number " + view.cutoff + ".";
  var kinds = Object.keys(KINDS);
  $("fk-body").innerHTML = '<div class="bd-scroll"><div class="bd-grid" style="grid-template-columns: repeat(' + kinds.length + ', minmax(160px, 1fr))">' +
    kinds.map(function (k) {
      var items = view.items.filter(function (r) { return r.kind === k; });
      return column(esc(KINDS[k]), items.length, items.map(function (r) {
        return '<button class="fk-item" data-open="' + esc(r.record_id) + '"><b>' + esc(r.title) + '</b><span class="fk-sub">' +
          esc("saved " + full(r.saved_at) + (r.saved_by ? " by " + r.saved_by : "")) + "</span></button>";
      }).join(""), "bd-kind-" + k);
    }).join("") + "</div></div>";
}

// ---- A plan ----

/** How late, in whole minutes under an hour, at least 1, and whole hours after. */
function late(s) { return s < 3600 ? Math.max(1, Math.floor(s / 60)) + " min" : Math.floor(s / 3600) + " h"; }
function badges(a) {
  var out = [];
  if (a.overdue_seconds > 0) out.push('<span class="fk-badge late">Overdue ' + late(a.overdue_seconds) + "</span>");
  if (a.due_to_start) out.push('<span class="fk-badge due">Due to start</span>');
  if (a.blockers.length) out.push('<span class="fk-badge blocked">Blocked ' + a.blockers.length + "</span>");
  return out.length ? '<span class="fk-badges">' + out.join("") + "</span>" : "";
}
function activityCard(a) {
  return '<button class="fk-item" data-open="' + esc(a.id) + '"><span class="fk-sub">' + esc(kindOf(a)) + "</span><b>" + esc(named(a)) + "</b>" +
    '<span class="fk-sub">' + esc(span(a)) + "</span>" + badges(a) + "</button>";
}
/** The part the board opens on: the first in progress, else the first not finished, else the first. */
function firstPart(m) {
  var parts = m.rows.map(function (r) { return m.byId[r.activity]; });
  var pick = parts.filter(function (a) { return a.state === "in_progress"; })[0]
    || parts.filter(function (a) { return a.state !== "completed" && a.state !== "cancelled"; })[0] || parts[0];
  return pick ? pick.id : "all";
}
function drawPlan() {
  var m;
  try { m = planModel(view); } catch (e) { failed($("fk-body"), e); return; }
  $("bd-title").textContent = m.plan.title;
  $("bd-meta").textContent = "Plan · " + span(m.plan) + " · " + (view.scope_name || "") + " · read " + full(m.observed_at) + ", save number " + m.cutoff;
  if (!m.rows.length) { $("fk-body").innerHTML = '<p class="fk-sub">The plan has no activities under it yet.</p>'; return; }
  if (part === null || (part !== "all" && !m.rows.some(function (r) { return r.activity === part; }))) part = m.rows.length > 1 ? firstPart(m) : "all";
  if (m.rows.length > 1) {
    $("bd-tools").innerHTML = '<label>Part <select id="bd-part">' + m.rows.map(function (r) {
      return '<option value="' + esc(r.activity) + '"' + (part === r.activity ? " selected" : "") + ">" + esc(named(m.byId[r.activity])) + "</option>";
    }).join("") + '<option value="all"' + (part === "all" ? " selected" : "") + ">All</option></select></label>";
  }
  var rows = m.rows.filter(function (r) { return part === "all" || r.activity === part; });
  var cards = [].concat.apply([], rows.map(function (r) { return r.cards; })).map(function (id) { return m.byId[id]; });
  var heads = m.rows.map(function (r) { return m.byId[r.activity].kind; });
  var rowWord = heads.every(function (k) { return k === "plan"; }) ? "Plan" : heads.every(function (k) { return k === "task"; }) ? "Task" : "Plan or task";
  var widths = ["minmax(150px, 1.2fr)"].concat(STATES.map(function (s) { return s[0] === "cancelled" && !cancelledOpen ? "max-content" : "minmax(150px, 1fr)"; }));
  var html = '<div class="bd-colhead">' + rowWord + "</div>" + STATES.map(function (s) {
    var n = cards.filter(function (a) { return a.state === s[0]; }).length;
    var head = s[0] === "cancelled" ? '<button id="bd-cancelled" aria-expanded="' + cancelledOpen + '">' + s[1] + "</button>" : s[1];
    return '<div class="bd-colhead" id="bd-head-' + s[0] + '">' + head + ' <span class="fk-sub">' + n + "</span></div>";
  }).join("");
  rows.forEach(function (r) {
    var a = m.byId[r.activity];
    html += '<div class="bd-cell bd-rowhead"><button class="fk-item" data-open="' + esc(a.id) + '"><b>' + esc(named(a)) + '</b><span class="fk-sub">' +
      esc(span(a) + " · " + stateName(a.state)) + "</span>" + badges(a) + "</button></div>";
    STATES.forEach(function (s) {
      var here = s[0] === "cancelled" && !cancelledOpen ? [] : r.cards.map(function (id) { return m.byId[id]; }).filter(function (c) { return c.state === s[0]; });
      html += '<div class="bd-cell" data-state="' + s[0] + '">' + here.map(activityCard).join("") + "</div>";
    });
  });
  $("fk-body").innerHTML = '<div class="bd-scroll"><div class="bd-grid" id="bd-plan" style="grid-template-columns: ' + widths.join(" ") + '">' + html + "</div></div>";
}

// ---- A model ----

function norm(k) { return String(k).toLowerCase().replace(/[\s_-]+/g, ""); }
function attr(n, key) {
  if (key === "type") return n.type;
  var a = n.attributes || {}, k = Object.keys(a).filter(function (x) { return norm(x) === norm(key); })[0];
  return k === undefined ? undefined : a[k];
}
function isGap(n) { return n.type === "gap" || (n.attributes || {}).gap === true; }
function drawModel() {
  var r = view.record, g = (r.payload || {}).graph || {}, nodes = g.nodes || [];
  $("bd-title").textContent = r.title;
  $("bd-meta").textContent = "Model · " + (r.scope_name || "") + " · version " + r.version_number + ((r.payload || {}).description ? " · " + r.payload.description : "");
  var keys = ["type"];
  nodes.forEach(function (n) { Object.keys(n.attributes || {}).forEach(function (k) { if (!keys.some(function (x) { return norm(x) === norm(k); })) keys.push(k); }); });
  $("bd-tools").innerHTML = '<label>Rows by <select id="bd-by">' + keys.map(function (k) {
    return '<option value="' + esc(k) + '"' + (norm(k) === norm(groupBy) ? " selected" : "") + ">" + esc(words(k)) + "</option>";
  }).join("") + "</select></label>";
  if (!nodes.length) { $("fk-body").innerHTML = '<p class="fk-sub">The model has no nodes.</p>'; return; }
  // rows has no prototype, so a group named constructor or toString is a group like any other.
  var order = [], rows = Object.create(null), loose = [];
  nodes.forEach(function (n) {
    var v = attr(n, groupBy);
    if (v === undefined || v === null || v === "") { loose.push(n); return; }
    v = typeof v === "object" ? JSON.stringify(v) : String(v);
    if (!rows[v]) { rows[v] = []; order.push(v); }
    rows[v].push(n);
  });
  var html = order.map(function (v) { return [v, rows[v]]; }).concat(loose.length ? [["Ungrouped", loose]] : []).map(function (row) {
    return '<section class="bd-row"><h3>' + esc(groupBy === "type" ? words(row[0]) : row[0]) + " · " + row[1].length + '</h3><div class="bd-cards">' + row[1].map(function (n) {
      var a = n.attributes || {}, second = a.role || a.title;
      return '<button class="fk-item' + (isGap(n) ? " gap" : "") + '" data-node="' + esc(n.id) + '"><b>' + esc(n.label || n.id) + "</b>" +
        (second ? '<span class="fk-sub">' + esc(second) + "</span>" : "") + (a.description ? "<span>" + esc(a.description) + "</span>" : "") + "</button>";
    }).join("") + "</div></section>";
  }).join("");
  $("fk-body").innerHTML = '<div id="bd-model">' + html + "</div>";
}
function nodePanel(id) {
  var g = (view.record.payload || {}).graph || {}, nodes = g.nodes || [], edges = g.edges || [];
  var label = {}; nodes.forEach(function (n) { label[n.id] = n.label || n.id; });
  var n = nodes.filter(function (x) { return x.id === id; })[0];
  if (!n) return;
  var lines = edges.filter(function (e) { return e.source === id; }).map(function (e) { return words(e.type) + " " + label[e.target]; })
    .concat(edges.filter(function (e) { return e.target === id; }).map(function (e) { return label[e.source] + " " + String(e.type).replace(/_/g, " ") + " this"; }));
  var panel = $("fk-panel");
  panel.hidden = false;
  panel.innerHTML = '<div class="fk-head"><h3 id="fk-node-title">' + esc(n.label || n.id) + '</h3><button class="fk-btn" data-close>Close</button></div>' +
    '<p class="fk-sub">' + esc(words(n.type || "node")) + (isGap(n) ? " · a gap" : "") + "</p>" + fieldsTable(n.attributes) +
    (lines.length ? '<p class="fk-sub">Lines</p><ul class="fk-links">' + lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" : '<p class="fk-sub">No lines to other nodes.</p>');
}

$("bd-refresh").addEventListener("click", load);
$("fk-body").addEventListener("click", function (e) {
  var t = e.target && e.target.closest ? e.target.closest("[data-node],#bd-cancelled") : null;
  if (!t) return;
  if (t.id === "bd-cancelled") { cancelledOpen = !cancelledOpen; draw(); return; }
  nodePanel(t.getAttribute("data-node"));
});
$("bd-tools").addEventListener("change", function (e) {
  if (e.target.id === "bd-part") part = e.target.value;
  if (e.target.id === "bd-by") groupBy = e.target.value;
  draw();
});
wireRecords($("fk-body"), $("fk-panel"));
wireRecords($("fk-panel"), $("fk-panel"));
onResult(function (g) { given = g; load(); });
</script>
